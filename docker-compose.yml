services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sting
      POSTGRES_USER: sting
      POSTGRES_PASSWORD: sting123
    volumes:
      - sting_db:/var/lib/postgresql/data
    ports:
      - 5433:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sting]
      interval: 5s
      timeout: 5s
      retries: 5

  sting-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 8001:8001
    environment:
      - STING_DB_HOST=postgres
      - STING_DB_PORT=5432
      - STING_DB_NAME=sting
      - STING_DB_USER=sting
      - STING_DB_PASSWORD=sting123
      - REDIS_HOST=10.10.10.104
      - REDIS_PORT=6379
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=7947899549
    depends_on:
      postgres:
        condition: service_healthy

  sting-frontend:
    image: nginx:alpine
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - 3001:80
    depends_on:
      - sting-backend

  sting-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    environment:
      - REDIS_HOST=10.10.10.104
      - REDIS_PORT=6379
    depends_on:
      - sting-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  sting_db:
