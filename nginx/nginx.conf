user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format sting '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'sid=$sid verdict=$verdict';

    access_log /var/log/nginx/access.log sting;

    # Redis upstream for verdict checking
    upstream redis_backend {
        server 10.10.10.104:6379;
        keepalive 32;
    }

    # Backend upstream
    upstream sting_backend {
        server sting-backend:8001;
        keepalive 32;
    }

    # Lua shared dictionary for session tracking
    lua_shared_dict sting_sessions 10m;

    # Initialize Redis connection
    init_by_lua_block {
        local redis = require "resty.redis"
        -- Redis config
        redis_host = "10.10.10.104"
        redis_port = 6379
        redis_timeout = 1000  -- 1 second
    }

    server {
        listen 8080;
        server_name _;

        location / {
            # Generate session ID from client IP + User-Agent hash
            set $sid '';
            set $verdict 'LAB';

            access_by_lua_block {
                local redis = require "resty.redis"
                local red = redis:new()
                red:set_timeout(1000)

                -- Connect to Redis
                local ok, err = red:connect(redis_host, redis_port)
                if not ok then
                    ngx.log(ngx.ERR, "failed to connect to redis: ", err)
                    -- Allow request through if Redis is down
                    ngx.var.verdict = "LAB"
                else
                    -- Generate session ID
                    local client_ip = ngx.var.remote_addr
                    local user_agent = ngx.var.http_user_agent or ""
                    local sid = ngx.md5(client_ip .. user_agent)
                    ngx.var.sid = sid

                    -- Check verdict from Redis
                    local res, err = red:get("sting:session:" .. sid)
                    if res and res ~= ngx.null then
                        ngx.var.verdict = res
                    else
                        -- New session, set default
                        red:setex("sting:session:" .. sid, 3600, "LAB")
                        ngx.var.verdict = "LAB"
                    end

                    -- Put connection back to pool
                    local ok, err = red:set_keepalive(10000, 100)
                end

                -- NUKE verdict: drop connection immediately
                if ngx.var.verdict == "NUKE" then
                    ngx.log(ngx.WARN, "NUKE verdict for session ", ngx.var.sid)
                    -- Log the nuke event
                    local http = require "resty.http"
                    local httpc = http.new()
                    httpc:set_timeout(500)
                    local res, err = httpc:request_uri("http://127.0.0.1:8001/api/v1/events/nuke", {
                        method = "POST",
                        body = ngx.encode_args({
                            session_id = ngx.var.sid,
                            src_ip = ngx.var.remote_addr,
                            method = ngx.var.request_method,
                            path = ngx.var.request_uri,
                            user_agent = ngx.var.http_user_agent or ""
                        }),
                        headers = {
                            ["Content-Type"] = "application/x-www-form-urlencoded"
                        }
                    })
                    -- Return 444 to drop connection
                    return ngx.exit(444)
                end
            }

            proxy_pass http://sting_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Session-ID $sid;
            proxy_set_header X-Verdict $verdict;

            # Log request details
            log_by_lua_block {
                local redis = require "resty.redis"
                local red = redis:new()
                red:set_timeout(500)

                local ok, err = red:connect(redis_host, redis_port)
                if ok then
                    -- Increment request count
                    red:hincrby("sting:session:" .. ngx.var.sid .. ":stats", "requests", 1)
                    -- Log request details
                    red:lpush("sting:session:" .. ngx.var.sid .. ":requests", 
                        string.format('%s|%s|%s|%s', 
                            ngx.time(), 
                            ngx.var.request_method, 
                            ngx.var.request_uri,
                            ngx.var.body_bytes_sent or 0
                        )
                    )
                    -- Trim to last 100 requests
                    red:ltrim("sting:session:" .. ngx.var.sid .. ":requests", 0, 99)
                    red:set_keepalive(10000, 100)
                end
            }
        }

        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
